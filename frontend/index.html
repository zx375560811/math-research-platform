              <label class="library-search"><span class="sr-only">搜索文献</span><input id="library-query" placeholder="在当前目录搜索标题或作者" maxlength="200"></label><button class="button primary" type="submit">搜索</button>
              <details class="library-extra-filters"><summary>筛选</summary><div><label>应用模块<select id="library-module"><option value="">所有模块</option></select></label><label>研究方向<select id="library-direction"><option value="">所有方向</option></select></label></div></details>
            </form>
            <p id="library-status" role="status" aria-live="polite"></p>
            <div class="library-table-scroll"><table class="library-table"><thead><tr><th scope="col">文献名称</th><th scope="col" class="library-author-column">作者</th><th scope="col">格式</th><th scope="col"><span class="sr-only">阅读</span></th></tr></thead><tbody id="library-documents"></tbody></table></div>
            <div class="library-pagination"><button id="library-prev" class="button">上一页</button><span id="library-page"></span><button id="library-next" class="button">下一页</button><button id="library-retry" class="button">刷新</button></div>
          </div>
        </div>
      </section>
      <section id="module-view" hidden>
        <section id="direction-detail" hidden>
          <div class="direction-heading"><a href="#/" class="back-link">← 应用工作台</a><h1 id="direction-title"></h1></div>
          <section class="direction-intro-section" aria-labelledby="introduction-title"><h2 id="introduction-title" class="sr-only">方向介绍</h2><dl id="direction-introduction" class="direction-introduction"></dl></section>
          <section aria-labelledby="textbooks-title"><div class="section-heading"><h2 id="textbooks-title">递进教材</h2></div><div id="textbook-list" class="textbook-list"></div></section>
        </section>
        <p id="learning-status" class="list-status" role="status"></p><button id="retry-learning" class="button" hidden>重新加载</button>
      </section>
      <section id="reader-view" hidden aria-labelledby="reader-title">
        <div id="reader-heading" class="reader-heading"><div class="reader-document-heading"><a id="reader-back" class="back-link" href="#/apps/mathematics" aria-label="返回教材">← 返回教材</a><h1 id="reader-title">教材阅读</h1><div class="reader-heading-actions"><button id="reader-outline-toggle" class="button compact" aria-expanded="true"><span data-icon="book" aria-hidden="true"></span><span>目录</span></button><button id="reader-fit-width" class="button compact"><span data-icon="fit" aria-hidden="true"></span><span>适合宽度</span></button><button id="reader-fullscreen" class="button compact"><span data-icon="expand" aria-hidden="true"></span><span id="reader-fullscreen-label">全屏</span></button></div></div><div class="reader-notes-heading"><h2>我的高亮笔记</h2></div></div>
        <div class="reader-layout">
          <aside id="reader-outline" class="reader-outline" aria-label="教材目录"></aside>
          <div id="reader-outline-resize" class="reader-resize" role="separator" aria-orientation="vertical" aria-label="调整目录宽度" aria-controls="reader-outline" tabindex="0" title="拖拽调整目录宽度，也可用左右方向键"></div>
          <div id="reader-scroll" class="reader-scroll" tabindex="0" aria-label="PDF 连续阅读区域"><div id="pdf-pages" class="pdf-pages"></div></div>
        </div>
          <div id="reader-notes-resize" class="reader-resize" role="separator" aria-orientation="vertical" aria-label="调整笔记宽度" aria-controls="reader-notes" tabindex="0" title="拖拽调整笔记宽度，也可用左右方向键"></div>
          <aside id="reader-notes" class="reader-notes">
            <section class="reader-note-pane" aria-label="高亮笔记"><div id="annotation-list"></div><div id="selection-tools" hidden><p id="selection-quote"></p><div class="highlight-colors"><button class="button compact" data-highlight="yellow">黄色</button><button class="button compact" data-highlight="blue">蓝色</button><button class="button compact" data-highlight="pink">粉色</button></div></div></section>
            <div id="reader-ai-resize" class="reader-ai-resize" role="separator" aria-orientation="horizontal" aria-label="调整高亮笔记与 AI 的上下高度" aria-valuemin="10" aria-valuemax="75" aria-valuenow="35" tabindex="0" title="上下拖拽调整笔记与 AI 区域，或使用上下方向键"></div>
            <section class="reader-ai-pane" aria-label="AI 对话"><div class="reader-panel-heading"><h2>AI 对话</h2><div class="ai-provider"><select id="ai-source" aria-label="AI API 来源"><option value="default">默认 API</option><option value="custom">我的 API</option></select><span id="ai-provider-label" class="sr-only">尚未配置</span></div><div class="ai-heading-actions"><button id="ai-clear" class="button compact" type="button"><span data-icon="refresh" aria-hidden="true"></span><span>清空</span></button><button id="ai-settings-toggle" class="button compact" type="button" aria-expanded="false" aria-controls="ai-settings"><span data-icon="settings" aria-hidden="true"></span><span>设置</span></button></div></div>
              <form id="ai-settings" class="ai-settings" hidden><p id="ai-default-info"></p><label>个人 API 地址<input id="ai-base-url" type="url" placeholder="https://api.example.com/v1" maxlength="500" required></label><label>模型名称<input id="ai-model" placeholder="填写服务商的模型名" maxlength="200" required></label><label>API 密钥<input id="ai-api-key" type="password" autocomplete="off" maxlength="4096" placeholder="请输入 API 密钥"></label><div class="ai-heading-actions"><button id="ai-settings-save" class="button primary compact" type="submit">保存并使用个人 API</button><button id="ai-clear-key" class="button compact" type="button">删除密钥</button></div></form>
              <div id="ai-messages" class="ai-messages" role="log" aria-label="AI 对话记录" aria-live="polite"></div>
              <div id="ai-context" class="ai-context" hidden><div><strong id="ai-context-label"></strong><button id="ai-context-remove" class="button compact" type="button" aria-label="移除 PDF 选段">×</button></div><p id="ai-context-quote"></p></div>
              <p id="ai-status" class="ai-status" role="status"></p><form id="ai-chat-form" class="ai-chat-form"><label class="sr-only" for="ai-question">向 AI 提问</label><textarea id="ai-question" rows="3" placeholder="输入问题，Ctrl + Enter 发送" required></textarea><div class="ai-compose-foot"><button id="reader-ask-ai" class="button compact" type="button" disabled title="先选中 PDF 中的文字"><span data-icon="spark" aria-hidden="true"></span><span>问 AI</span></button><button id="ai-send" class="button primary compact" type="submit" disabled><span data-icon="send" aria-hidden="true"></span><span id="ai-send-label">发送</span></button></div></form>
            </section>
          </aside>
        <div id="reader-bottom-bar" class="reader-bottom-bar" aria-hidden="true"></div>
        <div class="reader-foot"><span id="reader-status" role="status">正在打开教材…</span><span id="reader-save-status" role="status"></span></div>
      </section>
    </main>

  </div>
</body>
</html>
