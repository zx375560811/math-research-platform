<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>云数学 · 数学研究平台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">∑</span><span>云数学<small>数学研究平台</small></span></a>
    <nav aria-label="主导航"><a href="#/" id="home-link">研究工作台</a><span class="nav-note">从一个问题开始</span></nav>
  </header>
  <main>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="home-view">
      <div class="hero">
        <div><p class="eyebrow">你的数学研究空间</p><h1>让每一次阅读，<br>成为研究的起点。</h1><p class="hero-copy">按专业组织文献，积累问题与思路。<br>从选择一个数学方向开始。</p><a class="button primary" href="#directions">探索数学方向 <span aria-hidden="true">↗</span></a></div>
        <div class="math-art" aria-hidden="true"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><span class="art-equation">∫<sub>γ</sub> ω</span><span class="art-caption">Ideas, connected.</span></div>
      </div>
      <section class="section" id="directions" aria-labelledby="directions-title"><div class="section-heading"><div><p class="eyebrow">专业模块</p><h2 id="directions-title">选择你的研究方向</h2></div><span class="muted">共享文献 · 独立探索</span></div><div id="subject-cards" class="subject-grid" aria-live="polite"><p class="muted">正在加载数学方向…</p></div><button id="retry-subjects" class="button" hidden>重新加载</button></section>
      <section class="section" aria-labelledby="recent-title"><div class="section-heading"><h2 id="recent-title">最近加入的文献</h2></div><div id="recent-documents" class="document-list" aria-live="polite"></div></section>
      <div class="future-note"><span class="future-symbol" aria-hidden="true">✧</span><div><strong>研究工具，逐步生长</strong><p>AI 文献助手与更多应用将在后续加入。</p></div><span class="pill">规划中</span></div>
    </section>
    <section id="module-view" hidden>
      <a class="back-link" href="#/">← 返回研究工作台</a>
      <div class="module-heading"><p class="eyebrow">数学专业模块</p><h1 id="module-title"></h1><p class="muted">收集这个方向的文献，从阅读开始研究。</p></div>
      <div class="module-layout">
        <section class="library-panel" aria-labelledby="library-title"><div class="section-heading"><h2 id="library-title">专业文献</h2><button class="button compact" id="refresh-documents">刷新</button></div><p class="list-status muted" id="list-status" role="status"></p><div id="module-documents" class="document-list"></div><div class="pagination"><button class="button compact" id="previous-page" disabled>上一页</button><span id="page-label">第 1 页</span><button class="button compact" id="next-page" disabled>下一页</button></div></section>
        <aside class="upload-panel"><p class="eyebrow">添加研究资料</p><h2>上传文献</h2><form id="upload-form">
          <label class="file-picker" for="pdf-file"><span class="file-symbol" aria-hidden="true">↑</span><strong id="file-label">选择一份 PDF</strong><span id="file-detail">最大 20 MB</span><input id="pdf-file" type="file" accept=".pdf,application/pdf" required></label>
          <label for="document-title">文献标题 <span class="required">*</span></label><input id="document-title" name="title" type="text" required placeholder="输入论文或书籍标题">
          <label for="document-authors">作者 <span class="optional">选填</span></label><input id="document-authors" name="authors" type="text" placeholder="例如：作者甲，作者乙">
          <label for="document-subject">所属专业</label><select id="document-subject" name="subject_id" required></select>
          <button class="button primary upload-button" id="upload-submit" type="submit">保存到文献库 <span aria-hidden="true">↗</span></button>
          <progress id="upload-progress" max="100" value="0" aria-label="上传进度" hidden></progress><p id="upload-message" class="form-message" role="status"></p>
        </form></aside>
      </div>
    </section>
  </main>
  <footer><span>云数学 · 数学研究平台</span><span>文献是起点，研究是方向。</span></footer>
</body>
</html>
