<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理平台 · 公理</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head>
<body class="admin-page">
<a class="skip-link" href="#admin-main">跳到管理内容</a>
<aside class="admin-rail"><a class="brand" href="/#/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="15" fill="#182b46"/>
<g fill="none" stroke="#f8fbff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M17 44V23H26"/><path d="M17 44L40 21H49"/><path d="M17 44H47V35"/>
</g><path d="M13 40H21V48H13Z" fill="#7ad4cf"/></svg></span><span class="brand-copy"><svg class="brand-wordmark" viewBox="0 0 136 64" role="img" aria-label="公理" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M28 10C24 17 18 22 10 26M38 10C43 17 49 22 57 25M32 27L20 44H48M41 35L51 47"/>
<path d="M75 13H94M77 27H93M74 45L96 39M85 13V42M103 10H125V30H103ZM114 10V49M103 20H125M102 39H126M100 49H128"/>
</g></svg><small>内容管理平台</small></span></a><nav aria-label="管理导航"><a href="#documents" data-view="documents">文献库</a><a href="#books" data-view="books">教材配置</a><a href="#invitations" data-view="invitations">邀请码</a></nav><a class="return-app" href="/#/">返回应用工作台</a><p>管理研究内容<br>为应用提供学习材料</p></aside>
<main id="admin-main" class="admin-main">
<header class="admin-top"><span>管理员工作空间</span><div><span id="admin-user"></span><button id="admin-logout" class="button compact">退出</button></div></header>
<p id="admin-message" role="status" aria-live="polite" hidden></p>
<div id="admin-content" hidden>
<section id="documents-view"><div class="admin-heading"><div><h1>文献库</h1><p>维护 PDF 和文献信息，再将内容接入学习应用。</p></div><span class="admin-emblem" aria-hidden="true">∑</span></div>
<div class="admin-columns"><section class="admin-editor"><h2 id="document-form-title">导入文献</h2><form id="document-form">
<label>文献标题<input id="document-title" required maxlength="500"></label><label>作者<input id="document-authors" maxlength="500"></label>
<label>应用模块<select id="document-module"><option value="mathematics">数学与应用数学</option></select></label><label>文献语种<select id="document-language"><option value="und">未标注</option><option value="zh">中文</option><option value="en">英文</option></select></label><fieldset><legend>所属研究方向（可多选）</legend><div id="document-directions"></div></fieldset><fieldset id="document-subjects" hidden><legend>数学分类</legend><div id="subject-options"></div></fieldset>
<label id="document-file-label">PDF 文件<input id="document-file" type="file" accept="application/pdf,.pdf" required><small>仅管理员可导入，每个文件最多 20 MB。</small></label>
<div class="admin-actions"><button id="document-save" class="button primary" type="submit">导入文献</button><button id="document-cancel" type="button" class="button" hidden>取消编辑</button></div></form></section>
<section class="admin-records"><div class="list-heading"><h2>库中资料</h2><form id="document-search"><input id="document-query" aria-label="搜索标题或作者" placeholder="搜索标题或作者" maxlength="200"><button class="button" type="submit">搜索</button></form></div><div id="document-list"></div><div class="admin-pagination"><button id="documents-prev" class="button">上一页</button><span id="documents-page"></span><button id="documents-next" class="button">下一页</button></div></section></div></section>
<section id="books-view" hidden><div class="admin-heading"><div><h1>教材配置</h1><p>按研究方向组织教材，每个学习阶段分别配置中文和英文推荐，从本方向文献库选取 PDF。</p></div><span class="admin-emblem" aria-hidden="true">∫</span></div><div class="admin-columns"><section class="admin-editor"><div class="book-editor-heading"><h2 id="book-editor-title">配置推荐教材</h2><button id="new-book" class="button compact" type="button">新增推荐</button></div><form id="book-form"><label>选择教材<select id="book-select" required></select></label><p id="book-authors" class="admin-hint"></p><label>研究方向<select id="book-direction" required></select></label><label>推荐语种<select id="book-language"><option value="zh">中文推荐</option><option value="en">英文推荐</option></select></label><label>教材标题<input id="book-title" required maxlength="500"></label><label>作者<input id="book-author-input" maxlength="500"></label><label>学习阶段<select id="book-stage"><option>基础入门</option><option>核心理论</option><option>进阶学习</option></select></label><label>前置知识<input id="book-prerequisites" maxlength="500"></label><label>方向内排序<input id="book-order" type="number" min="0" max="10000" required><small>数字越小，越靠前。</small></label><label>从本方向文献库选取 PDF<input id="book-document-query" placeholder="搜索文献标题或作者" maxlength="200"><select id="book-document"><option value="">暂不关联</option></select><small id="book-binding-hint">选择对应方向的文献，无需输入编号。</small></label><div class="book-document-pager"><button id="book-doc-prev" class="button compact" type="button">上一页</button><span id="book-doc-page"></span><button id="book-doc-next" class="button compact" type="button">下一页</button><button id="book-doc-search" class="button compact" type="button">搜索</button></div><label>教材信息链接（可选）<input id="book-source" type="url" placeholder="https://"></label><button class="button primary" type="submit">保存配置</button></form></section><section class="admin-records"><h2>教材目录</h2><div id="book-list"></div></section></div></section>
<section id="invitations-view" hidden><div class="admin-heading"><div><h1>邀请码</h1><p>只有持有效邀请码的用户才能注册，每个邀请码仅可使用一次。</p></div><span class="admin-emblem" aria-hidden="true">∞</span></div><div class="admin-columns"><section class="admin-editor"><h2>创建邀请码</h2><form id="invitation-form"><label>有效天数<input id="invitation-days" type="number" min="1" max="365" value="7" required></label><button class="button primary" type="submit">生成邀请码</button></form><div id="created-invitation" hidden><label>新邀请码<input id="invitation-code" readonly spellcheck="false"></label><button id="select-invitation" class="button">选中邀请码</button><p id="invitation-expiry"></p><p class="admin-hint">完整邀请码仅在本次生成后显示，请及时保存。</p></div></section><section class="admin-records"><h2>使用记录</h2><div id="invitation-list"></div><div class="admin-pagination"><button id="invitations-prev" class="button">上一页</button><span id="invitations-page"></span><button id="invitations-next" class="button">下一页</button></div></section></div></section>
</div></main></body></html>
