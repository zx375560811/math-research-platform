name: C backend checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libmicrohttpd-dev libsqlite3-dev
      - name: Compile C backend
        run: make -C backend
      - name: Check database initialization
        run: python3 backend/tests/schema.py
      - name: Check upload and retrieval flow
        run: python3 backend/tests/integration.py
