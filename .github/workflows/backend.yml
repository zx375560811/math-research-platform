name: Java backend checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Java backend
        run: cd backend && ./mvnw -B package
      - name: Check database initialization
        run: python3 backend/tests/schema.py
      - name: Check read-only API and administrator import
        run: python3 backend/tests/integration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --prefix frontend --ignore-scripts
      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Check application reading and navigation
        run: npm test --prefix frontend
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-screenshots
          path: frontend/tests/artifacts/
