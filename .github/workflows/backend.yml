name: Java backend checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  textbook-companions:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pinned textbook code and source boundaries
        run: python backend/tests/textbook_labs.py
  zotero-compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Check Zotero importer on older Python
        run: python backend/tests/zotero.py
      - name: Check additive series import on older Python
        run: python backend/tests/series_import.py
      - name: Check additive AI course book import on older Python
        run: python backend/tests/ai_books_import.py
      - name: Check local competition textbook import on older Python
        run: python backend/tests/competition_books.py
      - name: Check read-only ZIP duplicate verification
        run: python backend/tests/zip_library.py
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check deployment shell syntax
        run: bash -n backend/deploy/release.sh
      - name: Build Java backend
        run: cd backend && ./mvnw -B package
      - name: Check database initialization
        run: python3 backend/tests/schema.py
      - name: Check direction document availability
        run: python3 backend/tests/direction_availability.py
      - name: Check Zotero batch import and resume
        run: python3 backend/tests/zotero.py
      - name: Check folder library replacement and restart
        run: python3 backend/tests/folder_import.py
      - name: Check read-only API and administrator import
        run: python3 backend/tests/integration.py
      - name: Check administrator management and permissions
        run: python3 backend/tests/admin.py
      - name: Check mathematics competition materials and plan migration
        run: python3 backend/tests/competition.py
      - name: Check shared discussion permissions and persistence
        run: python3 backend/tests/discussions.py
      - name: Check reviewed competition PDF import
        run: python3 backend/tests/competition_import.py
      - name: Check AI settings, PDF context and provider boundaries
        run: python3 backend/tests/ai.py
      - name: Check background AI library organization
        run: python3 backend/tests/organizer.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --prefix frontend --ignore-scripts
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Check application reading and navigation
        run: npm test --prefix frontend
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-screenshots
          path: frontend/tests/artifacts/
