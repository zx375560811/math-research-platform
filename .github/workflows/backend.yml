name: Java backend checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zotero-compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Check Zotero importer on older Python
        run: python backend/tests/zotero.py
      - name: Check additive series import on older Python
        run: python backend/tests/series_import.py
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Java backend
        run: cd backend && ./mvnw -B package
      - name: Check database initialization
        run: python3 backend/tests/schema.py
      - name: Check direction document availability
        run: python3 backend/tests/direction_availability.py
      - name: Check Zotero batch import and resume
        run: python3 backend/tests/zotero.py
      - name: Check folder library replacement and restart
        run: python3 backend/tests/folder_import.py
      - name: Check read-only API and administrator import
        run: python3 backend/tests/integration.py
      - name: Check administrator management and permissions
        run: python3 backend/tests/admin.py
      - name: Check AI settings, PDF context and provider boundaries
        run: python3 backend/tests/ai.py
      - name: Check background AI library organization
        run: python3 backend/tests/organizer.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --prefix frontend --ignore-scripts
      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Check application reading and navigation
        run: npm test --prefix frontend
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-screenshots
          path: frontend/tests/artifacts/
