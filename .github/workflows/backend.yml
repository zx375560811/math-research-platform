name: C backend checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libmicrohttpd-dev libsqlite3-dev
      - name: Compile C backend
        run: make -C backend
      - name: Check database initialization
        run: python3 backend/tests/schema.py
      - name: Check read-only API and administrator import
        run: python3 backend/tests/integration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --prefix frontend --ignore-scripts
      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Check application reading and navigation
        run: npm test --prefix frontend
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-screenshots
          path: frontend/tests/artifacts/
